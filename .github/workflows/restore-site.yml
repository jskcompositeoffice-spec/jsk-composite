name: Restore JSK website source
on:
  push:
    paths:
      - ".github/workflows/restore-site.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate original complete website
        shell: bash
        run: |
          set -euo pipefail
          base="https://jsk-composite-preview.vercel.app"
          for f in index.html style.css app-core.js app-locales.js app.js i18n.js training-catalog-data.js training-catalog.js privacy.html; do
            curl --fail --location --silent --show-error --retry 3 --max-time 40 "$base/$f" -o "$f"
            size=$(wc -c < "$f")
            if (( size < 1600 )); then echo "Source appears truncated: $f ($size bytes)"; exit 1; fi
            echo "Restored $f: $size bytes"
          done
          grep -qi '</html>' index.html
          grep -qi 'training' index.html
          grep -qi '</html>' privacy.html
          git add index.html style.css app-core.js app-locales.js app.js i18n.js training-catalog-data.js training-catalog.js privacy.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Restore complete site assets from original Vercel release"
          git push
