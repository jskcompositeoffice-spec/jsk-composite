name: Chromium and WebKit audit
on:
  push:
  workflow_dispatch:
    inputs:
      production:
        description: Test the live Render deployment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and check source
        run: |
          for file in *.js tests/*.cjs; do node --check "$file"; done
          sh build.sh
          mkdir -p test-results
      - name: Run browser regression tests
        env:
          BASE_URL: ${{ inputs.production && 'https://jsk-composite.onrender.com' || 'http://127.0.0.1:8123' }}
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --directory dist > /tmp/jsk-server.log 2>&1 &
          node tests/audit.cjs | tee test-results/results.txt
      - name: Verify and test production after automatic Render deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://jsk-composite.onrender.com
        run: |
          set -euo pipefail
          found=0
          for round in $(seq 1 30); do
            actual=$(curl --fail --silent --max-time 15 "$BASE_URL/version.txt?check=$EXPECTED_SHA" || true)
            if [ "$actual" = "$EXPECTED_SHA" ]; then found=1; break; fi
            sleep 15
          done
          test "$found" = 1
          node tests/audit.cjs | tee test-results/production-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: test-results
