name: Verify deployed Render revision
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for matching production revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=https://jsk-composite.onrender.com
          found=0
          for round in $(seq 1 30); do
            actual=$(curl --fail --silent --max-time 15 "$base/version.txt?check=$EXPECTED_SHA" || true)
            if [ "$actual" = "$EXPECTED_SHA" ]; then found=1; break; fi
            sleep 15
          done
          test "$found" = 1
          for path in / /style.css /app.js /auto-language.js /ui-locales.js /privacy.html /favicon.svg /social-card.png /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error --max-time 30 "$base$path" -o /tmp/asset
            test -s /tmp/asset
          done
