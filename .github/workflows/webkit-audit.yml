name: JSK WebKit functional audit
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/webkit-audit.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install WebKit
        run: |
          mkdir /tmp/jskcheck && cd /tmp/jskcheck
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Test Safari-compatible behavior
        run: |
          cd /tmp/jskcheck
          cat > safari.cjs <<'JS'
          const {webkit}=require('playwright'), assert=require('node:assert/strict');
          (async()=>{
            let count=0;const b=await webkit.launch();
            for(const [c,l] of [['PL','pl'],['DE','de'],['GB','en']]){
              const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errs=[];p.on('pageerror',e=>errs.push(e.message));
              await p.route('**/api/geo',r=>r.fulfill({status:404,body:'Not Found'}));
              await p.route('https://get.geojs.io/**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({country:c})}));
              await p.route('https://web3forms.com/client/script.js',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
              let r=await p.goto('https://jsk-composite.onrender.com/',{waitUntil:'domcontentloaded'});
              await p.waitForTimeout(500);assert.equal(r.status(),200);
              assert.equal(await p.locator('html').getAttribute('lang'),l);
              const v=await p.evaluate(()=>[document.documentElement.scrollWidth,innerWidth]);
              assert(v[0]<=v[1]+3,'mobile horizontal overflow '+v);
              assert.deepEqual(errs,[]);
              console.log('PASS Safari '+c+' -> '+l+'; no overflow or JS errors');count++;
              if(c==='PL'){
                await p.locator('#menuBtn').click();
                assert.equal(await p.locator('#menuBtn').getAttribute('aria-expanded'),'true');
                await p.locator('#nav a[href="#training"]').click();
                assert.equal(await p.locator('#menuBtn').getAttribute('aria-expanded'),'false');
                console.log('PASS Safari mobile menu');count++;
                let payload='';
                await p.route('https://api.web3forms.com/submit',route=>{
                  payload=route.request().postData()||'';
                  return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:'{"success":true}'});
                });
                await p.locator('#rfq input[name="name"]').fill('Website Test');
                await p.locator('#rfq input[name="email"]').fill('test@example.com');
                await p.locator('#rfq textarea[name="message"]').fill('Test without real email');
                await p.locator('#rfq input[name="privacy_acknowledged"]').check();
                await p.evaluate(()=>{let t=document.createElement('textarea');t.name='h-captcha-response';t.value='test';t.hidden=true;document.getElementById('rfq').append(t)});
                await p.locator('#submitBtn').click();await p.waitForTimeout(500);
                assert(payload.includes('test@example.com'));
                assert((await p.locator('#formStatus').innerText()).includes('Wysłano!'));
                console.log('PASS mocked form submission / feedback');count++;
              }await p.close();
            }
            const p=await b.newPage();
            for(const url of ['https://web3forms.com/client/script.js','https://get.geojs.io/v1/ip/country.json']){
              const r=await p.request.get(url,{timeout:25000});
              assert.equal(r.status(),200);
              console.log('PASS service endpoint '+url);count++;
            }
            await b.close();console.log('WEBKIT AUDIT '+count+' PASS');
          })().catch(e=>{console.error('FAIL: '+e.stack);process.exitCode=1});
          JS
          node safari.cjs
